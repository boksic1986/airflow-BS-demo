name: ${COMPOSE_PROJECT_NAME:-airflow-wgs}

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "3"

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:-airflow-demo/airflow:0.1.0}
  build:
    context: ./airflow_image
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-env
    TZ: ${AIRFLOW_DEMO_TZ:-Asia/Shanghai}
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?set AIRFLOW_WEBSERVER_SECRET_KEY}
    BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}
    INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
    DEPLOYED_PIPELINES: wgs
    WGS_EXECUTION_ENABLED: "${WGS_EXECUTION_ENABLED:-false}"
    WGS_RUNTIME_ADAPTER_ENABLED: "${WGS_RUNTIME_ADAPTER_ENABLED:-false}"
    WGS_SSH_CONFIG_PATH: /opt/airflow/ssh/config
    WGS_RUNNER_200_ALIAS: ${WGS_RUNNER_200_ALIAS:-wgs-node200}
    WGS_RUNNER_200_COMMAND: ${WGS_RUNNER_200_COMMAND:-/home/hanjj/.config/airflow-wgs/forced-command.sh}
    PIPELINE_PROFILE_CONFIG_PATH: /opt/airflow/config/pipeline_profiles.wgs.yaml
  volumes:
    - ./dags/bio_wgs.py:/opt/airflow/dags/bio_wgs.py:ro
    - ./dags/common:/opt/airflow/dags/common:ro
    - ./config/pipeline_profiles.wgs.yaml:/opt/airflow/config/pipeline_profiles.wgs.yaml:ro
    - ./shared:/data/airflow-demo
    - ${WGS_SSH_KEY_HOST_ROOT:?set WGS_SSH_KEY_HOST_ROOT}:/opt/airflow/ssh:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - wgs-platform
  logging: *bounded-logging

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [wgs-platform]
    logging: *bounded-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [wgs-platform]
    logging: *bounded-logging

  biodemo-db-init:
    image: postgres:15-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      BIODEMO_DB: ${BIODEMO_DB:-biodemo}
      BIODEMO_USER: ${BIODEMO_USER:-biodemo}
      BIODEMO_PASSWORD: ${BIODEMO_PASSWORD:?set BIODEMO_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 \
          -v biodemo_db="$${BIODEMO_DB}" -v biodemo_user="$${BIODEMO_USER}" -v biodemo_password="$${BIODEMO_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'biodemo_user', :'biodemo_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'biodemo_user') \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'biodemo_db', :'biodemo_user')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'biodemo_db') \gexec
        SQL
    networks: [wgs-platform]

  biodemo-migrate:
    image: ${BACKEND_IMAGE:-airflow-demo/backend:0.1.0}
    restart: "no"
    depends_on:
      biodemo-db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:?set AIRFLOW_API_PASSWORD}
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend:/app:ro
    networks: [wgs-platform]

  platform-admin-init:
    image: ${BACKEND_IMAGE:-airflow-demo/backend:0.1.0}
    restart: "no"
    depends_on:
      biodemo-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:?set AIRFLOW_API_PASSWORD}
    command: ["python", "-m", "app.auth_admin_cli", "--username", "${PLATFORM_ADMIN_USERNAME:-admin}", "--password", "${PLATFORM_ADMIN_PASSWORD:?set PLATFORM_ADMIN_PASSWORD}"]
    volumes:
      - ./backend:/app:ro
    networks: [wgs-platform]

  backend:
    image: ${BACKEND_IMAGE:-airflow-demo/backend:0.1.0}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      platform-admin-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRFLOW_BASE_URL: http://airflow-api-server:8080
      AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME:-admin}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:?set AIRFLOW_API_PASSWORD}
      CONTAINER_SHARED_ROOT: /data/airflow-demo
      DEPLOYED_PIPELINES: wgs
      PLATFORM_ENVIRONMENT: "${PLATFORM_ENVIRONMENT:-Demo}"
      AUTH_REQUIRED: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      WGS_EXECUTION_ENABLED: "${WGS_EXECUTION_ENABLED:-false}"
      WGS_RUNTIME_ADAPTER_ENABLED: "${WGS_RUNTIME_ADAPTER_ENABLED:-false}"
      WGS_SUBMISSION_PREVIEW_ENABLED: "${WGS_SUBMISSION_PREVIEW_ENABLED:-false}"
      INTAKE_CONFIG_PATH: /config/intake.wgs.yaml
      PIPELINE_PROFILE_CONFIG_PATH: /config/pipeline_profiles.wgs.yaml
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      HOST_RESULTS_ROOT: /data/wgs-results
      WGS_RESULTS_HOST_ROOT: ${WGS_RESULTS_HOST_ROOT:?set WGS_RESULTS_HOST_ROOT}
      WGS_CONFIG_ROOTS: /data/wgs-intake
      WGS_FASTQ_ROOTS: ${WGS_FASTQ_HOST_ROOT:?set WGS_FASTQ_HOST_ROOT}
      WGS_VALIDATION_ROOTS: /data/wgs-intake
      WGS_EVIDENCE_ROOT: /data/wgs-evidence
      WGS_BINDING_ROOT: /data/wgs-bindings
      WGS_TRANSFER_SPOOL_ROOT: /data/wgs-runtime/transfer-progress
      WGS_RUNTIME_REQUEST_ROOT: /data/wgs-runtime/runner-requests
      WGS_RUNTIME_SHARED_GID: ${WGS_RUNTIME_SHARED_GID:-520}
      WGS_RUNTIME_BS_ROOT: ${WGS_RUNTIME_BS_ROOT:-/mnt/biodevrwsg2/33.chenjiucheng/WGS_test/airflow-wgs/runtime}
      WGS_RUNTIME_NODE200_ROOT: ${WGS_RUNTIME_NODE200_ROOT:-/sg2/biodevrwsg2/33.chenjiucheng/WGS_test/airflow-wgs/runtime}
      WGS_INTAKE_CONTAINER_ROOT: /data/wgs-intake
      WGS_INTAKE_HOST_ROOT: ${WGS_INTAKE_HOST_ROOT:?set WGS_INTAKE_HOST_ROOT}
      WGS_INTAKE_NODE200_ROOT: ${WGS_INTAKE_NODE200_ROOT:?set WGS_INTAKE_NODE200_ROOT}
      WGS_RELEASE_CATALOG_PATH: /config/wgs_releases.yaml
      WGS_PROJECT_CATALOG_PATH: /config/wgs_projects.yaml
      WGS_SUBMISSION_DRAFT_ROOT: /data/wgs-runtime/submission-drafts
      WGS_SUBMISSION_DRAFT_TTL_HOURS: "24"
      WGS_T7_FASTQ_ROOT: /bi/fastq/T7_Fastq
      WGS_INTAKE_SCAN_ENABLED: "${WGS_INTAKE_SCAN_ENABLED:-true}"
      WGS_INTAKE_SCAN_INTERVAL_SECONDS: "${WGS_INTAKE_SCAN_INTERVAL_SECONDS:-600}"
      WGS_AUTO_DISPATCH_ENABLED: "${WGS_AUTO_DISPATCH_ENABLED:-false}"
      WGS_AUTO_DISPATCH_NOT_BEFORE: "${WGS_AUTO_DISPATCH_NOT_BEFORE:-}"
      WGS_STAGE_CONTRACT_PATH: /config/wgs_stage_contract.yaml
      WGS_CONTRACT_V2_ENABLED: "${WGS_CONTRACT_V2_ENABLED:-false}"
      WGS_TRANSFER_ADAPTER: "${WGS_TRANSFER_ADAPTER:-obs_sdk}"
      WGS_HEAVY_SLOT_LIMIT: "${WGS_HEAVY_SLOT_LIMIT:-25}"
      WGS_HEAVY_SLOT_MODE: "${WGS_HEAVY_SLOT_MODE:-enforce}"
    volumes:
      - ./backend:/app:ro
      - ./shared:/data/airflow-demo
      - ${WGS_INTAKE_HOST_ROOT:?set WGS_INTAKE_HOST_ROOT}:/data/wgs-intake:ro
      - ${WGS_FASTQ_HOST_ROOT:?set WGS_FASTQ_HOST_ROOT}:${WGS_FASTQ_HOST_ROOT:?set WGS_FASTQ_HOST_ROOT}:ro
      - ${WGS_RESULTS_HOST_ROOT:?set WGS_RESULTS_HOST_ROOT}:/data/wgs-results:rw
      - ${WGS_EVIDENCE_HOST_ROOT:?set WGS_EVIDENCE_HOST_ROOT}:/data/wgs-evidence:ro
      - ${WGS_BINDING_HOST_ROOT:?set WGS_BINDING_HOST_ROOT}:/data/wgs-bindings:rw
      - ${WGS_RUNTIME_HOST_ROOT:?set WGS_RUNTIME_HOST_ROOT}:/data/wgs-runtime:rw
      - ./config:/config:ro
    networks: [wgs-platform]
    logging: *bounded-logging

  wgs-run-observer:
    image: ${BACKEND_IMAGE:-airflow-demo/backend:0.1.0}
    restart: unless-stopped
    depends_on:
      platform-admin-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.wgs_observer_cli", "--evidence-root", "/data/wgs-evidence", "--interval", "5"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:?set AIRFLOW_API_PASSWORD}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      DEPLOYED_PIPELINES: wgs
      WGS_EVIDENCE_ROOT: /data/wgs-evidence
      WGS_OBSERVER_INTERVAL: "5"
      WGS_TRANSFER_SPOOL_ROOT: /data/wgs-runtime/transfer-progress
      WGS_RUNTIME_REQUEST_ROOT: /data/wgs-runtime/runner-requests
    volumes:
      - ./backend:/app:ro
      - ${WGS_EVIDENCE_HOST_ROOT:?set WGS_EVIDENCE_HOST_ROOT}:/data/wgs-evidence:ro
      - ${WGS_RUNTIME_HOST_ROOT:?set WGS_RUNTIME_HOST_ROOT}:/data/wgs-runtime:ro
    logging: *bounded-logging
    networks: [wgs-platform]

  platform-node-probe:
    image: ${AIRFLOW_IMAGE:-airflow-demo/airflow:0.1.0}
    user: "${AIRFLOW_UID:-1000}:${WGS_RUNTIME_SHARED_GID:-520}"
    restart: unless-stopped
    command: ["python", "-m", "app.platform_node_probe_cli"]
    environment:
      TZ: ${AIRFLOW_DEMO_TZ:-Asia/Shanghai}
      PYTHONPATH: /app
      PLATFORM_METRICS_INTERVAL_SECONDS: "60"
      PLATFORM_NODE_PROBE_SSH_CONFIG: /opt/platform-metrics/ssh/metrics_config
      PLATFORM_NODE_METRICS_SPOOL: /data/wgs-runtime/platform-metrics/nodes.json
    volumes:
      - ./backend:/app:ro
      - ${PLATFORM_METRICS_SSH_HOST_ROOT:?set PLATFORM_METRICS_SSH_HOST_ROOT}:/opt/platform-metrics/ssh:ro
      - ${WGS_RUNTIME_HOST_ROOT:?set WGS_RUNTIME_HOST_ROOT}:/data/wgs-runtime
    logging: *bounded-logging
    networks: [wgs-platform]

  platform-metrics-collector:
    image: ${BACKEND_IMAGE:-airflow-demo/backend:0.1.0}
    restart: unless-stopped
    depends_on:
      platform-admin-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.platform_metrics_collector_cli"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:?set AIRFLOW_API_PASSWORD}
      DEPLOYED_PIPELINES: wgs
      PLATFORM_METRICS_INTERVAL_SECONDS: "60"
      PLATFORM_NODE_METRICS_SPOOL: /data/wgs-runtime/platform-metrics/nodes.json
      PLATFORM_CLOUD_METRICS_SPOOL: /data/wgs-runtime/platform-metrics/cloud.json
    volumes:
      - ./backend:/app:ro
      - ${WGS_RUNTIME_HOST_ROOT:?set WGS_RUNTIME_HOST_ROOT}:/data/wgs-runtime:ro
    logging: *bounded-logging
    networks: [wgs-platform]

  wgs-intake-scanner:
    image: ${BACKEND_IMAGE:-airflow-demo/backend:0.1.0}
    restart: unless-stopped
    depends_on:
      platform-admin-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.wgs_intake_scanner_cli", "--intake-root", "/bi/fastq/T7_Fastq", "--intake-interval", "${WGS_INTAKE_SCAN_INTERVAL_SECONDS:-600}"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:?set AIRFLOW_API_PASSWORD}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      DEPLOYED_PIPELINES: wgs
      WGS_T7_FASTQ_ROOT: /bi/fastq/T7_Fastq
      WGS_INTAKE_SCAN_ENABLED: "${WGS_INTAKE_SCAN_ENABLED:-true}"
      WGS_INTAKE_SCAN_INTERVAL_SECONDS: "${WGS_INTAKE_SCAN_INTERVAL_SECONDS:-600}"
      WGS_AUTO_DISPATCH_ENABLED: "${WGS_AUTO_DISPATCH_ENABLED:-false}"
      WGS_BACKEND_INTERNAL_URL: http://backend:8000
      WGS_INTAKE_IGNORED_CHIP_IDS: "${WGS_INTAKE_IGNORED_CHIP_IDS:-}"
    volumes:
      - ./backend:/app:ro
      - ${WGS_T7_FASTQ_HOST_ROOT:-/bi/fastq/T7_Fastq}:/bi/fastq/T7_Fastq:ro
    logging: *bounded-logging
    networks: [wgs-platform]

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        airflow pools set wgs_cce_runs 4 "Maximum concurrent project-level CCE WGS masters"
        airflow pools set wgs_obs_transfer 1 "Serialized private OBS transfer gate"
        airflow users create --username "$${AIRFLOW_ADMIN_USERNAME}" --firstname Airflow --lastname Admin --role Admin --email "$${AIRFLOW_ADMIN_EMAIL}" --password "$${AIRFLOW_ADMIN_PASSWORD}" || true
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-airflow-demo@example.com}

  airflow-api-server:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    restart: unless-stopped

  frontend-nginx:
    image: ${FRONTEND_IMAGE:-airflow-demo/frontend:0.1.0}
    build:
      context: ./frontend
      target: production
      args:
        NGINX_CONF: nginx.wgs.conf
        VITE_DISPLAY_TIME_ZONE: Asia/Shanghai
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${BS_HOST_IP:-172.17.106.10}:${FRONTEND_PORT:-12959}:80"
    volumes:
      - ./frontend/nginx.wgs.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [wgs-platform]
    logging: *bounded-logging

volumes:
  postgres-data:

networks:
  wgs-platform:
    external: true
    name: nipt_analysis_test_net
