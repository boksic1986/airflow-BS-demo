version: 1
defaults:
  ready_rule: stable_fingerprint
  stable_scans: 2
  auto_submit: true
pipelines:
  nipt_docker:
    enabled: true
    roots:
      - id: bs_nipt_fastq
        host_path: /sugon01/fq_backup/NIPT_fq_backup/FQ2026
        container_path: /data/nipt-fastq/FQ2026
    file_flavor: clean_fastq
    r1_pattern: "*.R1.clean.fastq.gz"
    r2_pattern: "*.R2.clean.fastq.gz"
    ignore_patterns:
      - "002/*.adapter.fastq.gz"
    intake:
      request_inbox: /data/airflow-intake/nipt
      request_glob: "*.nipt.yaml"
      request_submit_enabled: true
      stable_scans: 2
    auto_submit:
      enabled: false
      run_mode: full_run
  wgs:
    enabled: true
    roots:
      - id: wgs_controlled_validation
        container_path: /mnt/biodevrwsg2/33.chenjiucheng/WGS_test/WGS_20260527_T7Hg38V3.8.0_JX25_full_batchaware_direct_20260709_20260709_015245
    intake:
      request_inbox: /data/wgs-intake
      request_glob: "*.wgs.yaml"
      request_submit_enabled: false
      stable_scans: 2
    auto_submit:
      enabled: false
      stage: precalling
