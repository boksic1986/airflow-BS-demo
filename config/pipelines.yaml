version: 1
pipelines:
  wgs:
    display_name: WGS
    dag_id: bio_wgs
    version: 4.2.0
    adapter: wgs
    enabled: true
    submit_enabled: true
    capabilities:
      - intake
      - submit
      - rules
      - qc
      - artifacts
      - resume
      - rerun
    execution_targets:
      - cce
      - local
      - sge
  gatk:
    display_name: GATK Cloud
    dag_id: bio_gatk
    version: 7.6.0
    adapter: gatk
    enabled: true
    submit_enabled: true
    capabilities:
      - submit
      - rules
      - artifacts
    execution_targets:
      - cce
