version: 1

pipelines:
  pgta:
    default_profile: pgta-s9-predict-v1
    profiles:
      pgta-s9-predict-v1:
        label: PGT-A Snakemake 9 predict
        pipeline_version: pgta-s9-v1.4
        config_version: predict-v1
        submit_visible: true
        runtime:
          pipeline_root: /opt/pipelines/PGT_A_S9/releases/pgta-s9-v1.4
          release_manifest: /opt/pipelines/PGT_A_S9/releases/pgta-s9-v1.4/SHA256SUMS
          release_manifest_sha256: 84a1940baabf4a2564c1fcdbea42fafab50062e17dcde63098b2a758ae8b4591
          snakemake_bin: /biosoftware/miniconda/envs/snakemake9_env/bin/snakemake
          python_bin: /biosoftware/miniconda/envs/snakemake_env/bin/python
          conda_lib: /biosoftware/miniconda/envs/snakemake_env/lib
          libstdcxx: /biosoftware/miniconda/envs/snakemake_env/lib/libstdc++.so.6
          samtools_bin: /biosoftware/miniconda/pkgs/samtools-1.7-1/bin/samtools
          samtools_library_path: /biosoftware/miniconda/pkgs/openssl-1.0.2u-h516909a_0/lib
          fastp_bin: /biosoftware/bin/fastp
          bwa_bin: /biosoftware/bin/bwa
          wisecondorx_bin: /biosoftware/miniconda/envs/wise_env/bin/WisecondorX
          rscript_bin: /biosoftware/miniconda/envs/wise_env/bin/Rscript
          reference_genome: /data/Database/index/hg19/hg19.fa
          reference_xx_npz: /data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/XX/result/ref_xx_best.npz
          reference_xy_npz: /data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/XY/result/ref_xy_best.npz
          gender_reference_npz: /data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/gender/result/ref_gender_best.npz
          common_reference_binsize: /data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/gender/common_best_binsize.txt
          logger_plugin: airflow-demo
          logger_python_path: /opt/airflow/dags
          cores: 64
        editable_defaults: &pgta_predict_defaults
          core:
            wisecondorx:
              cnv:
                zscore: 5
                alpha: 0.001
                maskrepeats: 5
                minrefbins: 150
                qc:
                  min_total_counts: 1000000
                  min_nonzero_fraction: 0.4
                  max_mad_log1p: 1.2
        editable_schema: &pgta_predict_schema
          core.wisecondorx.cnv.zscore:
            type: number
            minimum: 1
            maximum: 20
          core.wisecondorx.cnv.alpha:
            type: number
            minimum: 0.000001
            maximum: 0.1
          core.wisecondorx.cnv.maskrepeats:
            type: integer
            minimum: 0
            maximum: 20
          core.wisecondorx.cnv.minrefbins:
            type: integer
            minimum: 10
            maximum: 1000
          core.wisecondorx.cnv.qc.min_total_counts:
            type: integer
            minimum: 10000
            maximum: 1000000000
          core.wisecondorx.cnv.qc.min_nonzero_fraction:
            type: number
            minimum: 0.01
            maximum: 1
          core.wisecondorx.cnv.qc.max_mad_log1p:
            type: number
            minimum: 0.01
            maximum: 10
      pgta-s9-validation:
        label: PGT-A Snakemake 9 validation
        pipeline_version: pgta-s9-v1.4
        config_version: predict-validation-v1
        submit_visible: false
        runtime:
          pipeline_root: /opt/pipelines/PGT_A_S9/releases/pgta-s9-v1.4
          release_manifest: /opt/pipelines/PGT_A_S9/releases/pgta-s9-v1.4/SHA256SUMS
          release_manifest_sha256: 84a1940baabf4a2564c1fcdbea42fafab50062e17dcde63098b2a758ae8b4591
          snakemake_bin: /biosoftware/miniconda/envs/snakemake9_env/bin/snakemake
          python_bin: /biosoftware/miniconda/envs/snakemake_env/bin/python
          conda_lib: /biosoftware/miniconda/envs/snakemake_env/lib
          libstdcxx: /biosoftware/miniconda/envs/snakemake_env/lib/libstdc++.so.6
          samtools_bin: /biosoftware/miniconda/pkgs/samtools-1.7-1/bin/samtools
          samtools_library_path: /biosoftware/miniconda/pkgs/openssl-1.0.2u-h516909a_0/lib
          fastp_bin: /biosoftware/bin/fastp
          bwa_bin: /biosoftware/bin/bwa
          wisecondorx_bin: /biosoftware/miniconda/envs/wise_env/bin/WisecondorX
          rscript_bin: /biosoftware/miniconda/envs/wise_env/bin/Rscript
          reference_genome: /data/Database/index/hg19/hg19.fa
          reference_xx_npz: /data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/XX/result/ref_xx_best.npz
          reference_xy_npz: /data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/XY/result/ref_xy_best.npz
          gender_reference_npz: /data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/gender/result/ref_gender_best.npz
          common_reference_binsize: /data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/gender/common_best_binsize.txt
          logger_plugin: airflow-demo
          logger_python_path: /opt/airflow/dags
          cores: 16
        editable_defaults:
          core:
            wisecondorx:
              cnv:
                zscore: 5
                alpha: 0.001
                maskrepeats: 5
                minrefbins: 150
                qc:
                  min_total_counts: 10000
                  min_nonzero_fraction: 0.01
                  max_mad_log1p: 10
        editable_schema: *pgta_predict_schema
      pgta-current:
        label: PGT-A current environment
        pipeline_version: current
        config_version: pgta-airflow-v1
        submit_visible: false
        runtime:
          pipeline_root: /opt/pipelines/PGT_A
          snakemake_bin: /biosoftware/miniconda/envs/snakemake_env/bin/snakemake
          python_bin: /biosoftware/miniconda/envs/snakemake_env/bin/python
          conda_lib: /biosoftware/miniconda/envs/snakemake_env/lib
          libstdcxx: /biosoftware/miniconda/envs/snakemake_env/lib/libstdc++.so.6
          samtools_bin: /biosoftware/miniconda/pkgs/samtools-1.7-1/bin/samtools
          samtools_library_path: /biosoftware/miniconda/pkgs/openssl-1.0.2u-h516909a_0/lib
          fastp_bin: /biosoftware/bin/fastp
          bwa_bin: /biosoftware/bin/bwa
          wisecondorx_bin: /biosoftware/miniconda/envs/wise_env/bin/WisecondorX
          rscript_bin: /biosoftware/miniconda/envs/wise_env/bin/Rscript
          reference_genome: /data/Database/index/hg19/hg19.fa
          cores: 64
        editable_defaults:
          core:
            wisecondorx:
              binsize: 100000
              use_chr_prefix: true
              reference_prefilter:
                binsize: 100000
                max_iterations: 3
        editable_schema:
          core.wisecondorx.binsize:
            type: integer
            minimum: 20000
            maximum: 1000000
          core.wisecondorx.use_chr_prefix:
            type: boolean
          core.wisecondorx.reference_prefilter.binsize:
            type: integer
            minimum: 20000
            maximum: 1000000
          core.wisecondorx.reference_prefilter.max_iterations:
            type: integer
            minimum: 1
            maximum: 10

  nipt_docker:
    default_profile: niptpro-s9-full-v1
    profiles:
      niptpro-s9-full-v1:
        label: NIPTPro 1.0.11 / Snakemake 9
        pipeline_version: 1.0.11-s9-v1
        config_version: v3.2.5.1-s9-v1
        submit_visible: true
        runtime:
          docker_image: airflow-demo/niptpro:1.0.11-snakemake9.23.1-v1
          fetal_image: 172.17.61.235:2333/niptpro/pytorch:biosan
          snakemake_version: 9.23.1
          python_version: "3.12"
          logger_plugin: airflow-demo
          cores: 40
        editable_defaults: &nipt_editable_defaults
          params:
            sexcutoff: 0.00007
            seed: 9696
            map_threads: 4
            aneuscreen_threads: 10
          mapper_v2:
            workers: 4
            worker_auto_max: 4
            pipe_buffer_bytes: 4194304
        editable_schema: &nipt_editable_schema
          params.sexcutoff:
            type: number
            minimum: 0
            maximum: 0.01
          params.seed:
            type: integer
            minimum: 0
            maximum: 2147483647
          params.map_threads:
            type: integer
            minimum: 1
            maximum: 40
          params.aneuscreen_threads:
            type: integer
            minimum: 1
            maximum: 40
          mapper_v2.workers:
            type: integer
            minimum: 1
            maximum: 40
          mapper_v2.worker_auto_max:
            type: integer
            minimum: 1
            maximum: 40
          mapper_v2.pipe_buffer_bytes:
            type: integer
            minimum: 65536
            maximum: 67108864
      niptpro-1.0.11:
        label: NIPTPro 1.0.11 / Snakemake 7 rollback
        pipeline_version: 1.0.11
        config_version: v3.2.5.1
        submit_visible: false
        runtime:
          docker_image: 172.17.61.235:2333/niptpro/niptpro:1.0.11
          fetal_image: 172.17.61.235:2333/niptpro/pytorch:biosan
          snakemake_version: 7.32.4
          python_version: "3.9"
          cores: 40
        editable_defaults: *nipt_editable_defaults
        editable_schema: *nipt_editable_schema
