version: 2
defaults:
  auto_submit: false
pipelines:
  wgs:
    enabled: true
    intake:
      mode: t7_scan_only
      root: /bi/fastq/T7_Fastq
      interval_seconds: 1800
      completion_marker: BarcodeStat.txt
      chip_directory_pattern: '^\d+th_(\d{8}[A-Z])_[A-Za-z0-9.-]+$'
      exclude_addon_sample_pattern: '-S\d+$'
      auto_dispatch_enabled: false
    auto_submit:
      enabled: false
