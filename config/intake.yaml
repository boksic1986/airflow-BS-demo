version: 1
defaults:
  ready_rule: stable_fingerprint
  stable_scans: 2
  auto_submit: true
pipelines:
  pgta:
    enabled: true
    roots:
      - id: pgta_rawdata
        container_path: /data/project/CNV/PGT-A/rawdata
    intake:
      mode: manifest_ready
      inbox_root: /data/project/CNV/PGT-A/rawdata/lib_test/pgta_crontab
      data_root: /data/project/CNV/PGT-A/rawdata/lib_test
      stable_scans: 2
      manifest_glob: "*.samples.tsv"
      ready_suffix: ".READY"
    auto_submit:
      enabled: true
      target: predict
      runtime_profile_id: pgta-s9-predict-v1
  nipt_docker:
    enabled: true
    roots:
      - id: nipt_fastq
        host_path: /home/jiucheng/pipelines/NIPT/fastq
        container_path: /opt/pipelines/NIPT/fastq
    file_flavor: clean_fastq
    r1_pattern: "*.R1.clean.fastq.gz"
    r2_pattern: "*.R2.clean.fastq.gz"
    ignore_patterns:
      - "002/*.adapter.fastq.gz"
    intake:
      discovery_roots:
        - /opt/pipelines/NIPT/fastq/intake/BS_DEMO_20260713
      request_inbox: /data/airflow-intake-requests/nipt
      request_glob: "*.nipt.yaml"
      request_submit_enabled: true
      stable_scans: 2
    auto_submit:
      enabled: false
      run_mode: full_run
